name: Sync Repository Labels

on:
  push:
    branches: [main]
    paths:
      - .github/labels.yml
      - .github/workflows/sync-labels.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: repository-label-sync
  cancel-in-progress: false

jobs:
  sync:
    # Do not apply label definitions from a feature branch on manual dispatch.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Fetch only label data at this exact trusted commit; no checkout or source execution.
      - name: Create or update managed labels without deleting existing labels
        uses: EndBug/label-sync@52074158190acb45f3077f9099fea818aa43f97a # v2.3.3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/.github/labels.yml
          delete-other-labels: 'false'
          dry-run: 'false'
