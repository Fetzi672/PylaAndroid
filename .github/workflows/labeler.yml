name: PR Labeler

# Metadata-only: never check out or execute a pull request's code.
# pull_request_target supplies label-write access for external fork PRs.
on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-labeler-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  label:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # With no checkout, the action reads the trusted configuration via GitHub API.
      # Repository label definitions are managed separately; no issues:write needed here.
      - name: Label changed surfaces
        uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: .github/labeler.yml
          sync-labels: 'false'
          dot: 'true'
