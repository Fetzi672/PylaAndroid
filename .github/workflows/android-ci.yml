name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Tests, lint and debug build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK and accept licenses
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          log-accepted-android-sdk-licenses: false

      - name: Set up Gradle and validate the wrapper
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
        with:
          validate-wrappers: true
          cache-read-only: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' || github.ref_name != github.event.repository.default_branch }}

      - name: Unit tests
        run: >-
          bash ./gradlew --no-daemon --max-workers=2 --no-parallel --console=plain
          '-Dorg.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8'
          -Pandroid.builder.sdkDownload=true :app:testDebugUnitTest

      - name: Android lint
        run: >-
          bash ./gradlew --no-daemon --max-workers=2 --no-parallel --console=plain
          '-Dorg.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8'
          -Pandroid.builder.sdkDownload=true :app:lintDebug

      - name: Build debug APK
        run: >-
          bash ./gradlew --no-daemon --max-workers=2 --no-parallel --console=plain
          '-Dorg.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8'
          -Pandroid.builder.sdkDownload=true :app:assembleDebug

      - name: Upload test and lint reports
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
            app/build/reports/lint-results-debug.*
          if-no-files-found: warn
          retention-days: 7

      - name: Upload debug APK
        if: ${{ success() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-debug-${{ github.run_id }}-${{ github.run_attempt }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
